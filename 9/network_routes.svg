<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#0f7d6d"/></marker><marker id="b" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4b3fd6"/></marker></defs>
<text x="20" y="545" fill="#1b2430">丸1個 ＝ 「z = a*x + b」を計算して関数 f を通す部品　／　線1本 ＝ 重み a（コードでは W[j][i]）　／　赤い線 ＝ 1つのルート</text>
<text x="20" y="565" fill="#5d6b7c" font-size="12">入力から出力までのルートは 4×4 = 16 本。どのルートも途中で関数 f を通るので、曲がった形が作れる</text>
