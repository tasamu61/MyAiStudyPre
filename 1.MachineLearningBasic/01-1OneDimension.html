<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>y = ax + b 学習デモ</title>
<style>
  canvas {
    border: 1px solid #aaa;
  }
</style>
</head>

<body>

<h2>y = a*x + b を学習する</h2>

<canvas id="graph" width="600" height="400"></canvas>

<p id="status"></p>

<button onclick="train(1)">1 epoch</button>
<button onclick="train(100)">100 epoch</button>
<button onclick="resetModel()">Reset</button>

<script>

const data = [
    [1, 3],
    [2, 5],
    [4, 9],
    [5, 11]
];
let epoch = 0;
let Tloss = 0;

// 初期値
let a = 0;
let b = 0;

// 学習率
const learningRate = 0.01;

const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");

// 機械学習を実装したロジックであり、
// ここれは回数をcount可変としている。
function train(count) {

	// 指定数、学習を繰り返す
    for (let n = 0; n < count; n++) {
        let gradA = 0;
        let gradB = 0;
        
        let loss = 0;

        // 指定数繰り返す
        for (const [x, y] of data) {
            // モデル式で計算して
            const prediction = a * x + b;
            // 誤差を求める
            const diff = prediction - y;
            // 損失関数として二乗
            loss += diff * diff;

            // a,bについて微分した値を求める。
            gradA += 2 * diff * x;
            gradB += 2 * diff;
        }
        Tloss = loss;
        // データ数で除算し１件あたりに
        gradA /= data.length;
        gradB /= data.length;

        // 学習率を乗算し、その値で補正
        a -= learningRate * gradA;
        b -= learningRate * gradB;

        epoch++;
    }

    draw();
}


function resetModel() {
    a = 0;
    b = 0;
    epoch = 0;

    draw();
}


function draw() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 座標変換
    function sx(x) {
        return 50 + x * 80;
    }

    function sy(y) {
        return 350 - y * 25;
    }


    // 軸
    ctx.beginPath();

    ctx.moveTo(50, 350);
    ctx.lineTo(550, 350);

    ctx.moveTo(50, 350);
    ctx.lineTo(50, 30);

    ctx.stroke();


    // 学習データ
    for (const [x, y] of data) {

        ctx.beginPath();

        ctx.arc(
            sx(x),
            sy(y),
            5,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    // 現在の直線 y = a*x+b
    const x1 = 0;
    const y1 = a * x1 + b;

    const x2 = 6;
    const y2 = a * x2 + b;

    ctx.beginPath();

    ctx.moveTo(
        sx(x1),
        sy(y1)
    );

    ctx.lineTo(
        sx(x2),
        sy(y2)
    );

    ctx.stroke();


    document.getElementById("status").textContent =
        "epoch=" + epoch +
        " loss=" + Tloss.toFixed(4) +
        "  a=" + a.toFixed(4) +
        "  b=" + b.toFixed(4) +
        "  x=7, y = x *" + a.toFixed(4) + " + " + b.toFixed(4) + "= " +  ( 7 * a + b).toFixed(4);
}


draw();

</script>

</body>
</html>
