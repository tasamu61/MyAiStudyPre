<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機械学習の基本 ― 回帰モデルと勾配降下法</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; margin: 20px; background-color: #f4f7f6; color: #333; }
        h1 { font-size: 1.5rem; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; }
        .panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .control-panel { flex: 1; min-width: 320px; }
        .display-panel { flex: 2; min-width: 400px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, input[type="number"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .param-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .param-grid div { display: flex; align-items: center; gap: 5px; }
        .param-grid label { margin-bottom: 0; min-width: 20px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; background: #007bff; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
        button.reset { background: #6c757d; }
        button.reset:hover { background: #5a6268; }
        canvas { background: white; border: 1px solid #ddd; border-radius: 4px; display: block; margin-top: 10px; }
        .status-box { background: #e9ecef; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 0.95rem; margin-top: 10px; }
    </style>
</head>
<body>

<h1>第1章 機械学習の基本 ― 回帰モデルと勾配降下法</h1>

<div class="container">
    <!-- 設定・操作パネル -->
    <div class="panel control-panel">
        <h3>設定・パラメータ</h3>
        
        <div class="form-group">
            <label>1. データセット選択</label>
            <select id="datasetSelect">
                <option value="fixed">一次の固定直線 (4点)</option>
                <option value="linear_noise">一次 50点 (ばらつきあり)</option>
                <option value="quad_noise">二次 50点 (ばらつきあり)</option>
            </select>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" id="outlierCheck"> 外れ値(3点)を追加する
            </label>
        </div>

        <div class="form-group">
            <label>2. モデル選択</label>
            <select id="modelSelect">
                <option value="1">一次式: y = a*x + b</option>
                <option value="2">二次式: y = a*x² + b*x + c</option>
                <option value="3">三次式: y = a*x³ + b*x² + c*x + d</option>
            </select>
        </div>

        <div class="form-group">
            <label>3. 損失関数</label>
            <select id="lossSelect">
                <option value="mse">MSE (平均二乗誤差)</option>
                <option value="mae">MAE (平均絶対誤差)</option>
            </select>
        </div>

        <div class="form-group">
            <label>4. パラメータ初期値</label>
            <div class="param-grid">
                <div><label>a:</label><input type="number" id="initA" value="0" step="0.1"></div>
                <div><label>b:</label><input type="number" id="initB" value="0" step="0.1"></div>
                <div id="wrapperC"><label>c:</label><input type="number" id="initC" value="0" step="0.1"></div>
                <div id="wrapperD"><label>d:</label><input type="number" id="initD" value="0" step="0.1"></div>
            </div>
        </div>

        <div class="form-group">
            <label>5. 学習率 (Learning Rate)</label>
            <input type="number" id="learningRate" value="0.01" step="0.000001">
        </div>

        <hr>

        <label>学習の実行 (Epoch追加)</label>
        <div class="btn-group">
            <button onclick="trainEpochs(1)">+1</button>
            <button onclick="trainEpochs(5)">+5</button>
            <button onclick="trainEpochs(10)">+10</button>
            <button onclick="trainEpochs(100)">+100</button>
        </div>

        <div class="btn-group">
            <button class="reset" onclick="resetModel()">パラメータリセット</button>
        </div>
    </div>

    <!-- グラフ・ステータス表示パネル -->
    <div class="panel display-panel">
        <canvas id="graphCanvas" width="500" height="400"></canvas>
        <div class="status-box" id="statusBox">
            <!-- パラメータとLossが表示されます -->
        </div>
    </div>
</div>

<script>
// =================================================================
// 1. 計算ロジック部分 (純粋な数値計算)
// =================================================================

let data = [];           // [{x, y}, ...]
let params = { a: 0, b: 0, c: 0, d: 0 };
let currentEpoch = 0;

// モデルの予測値計算
function predict(x, modelDegree, p) {
    if (modelDegree === 1) return p.a * x + p.b;
    if (modelDegree === 2) return p.a * Math.pow(x, 2) + p.b * x + p.c;
    if (modelDegree === 3) return p.a * Math.pow(x, 3) + p.b * Math.pow(x, 2) + p.c * x + p.d;
    return 0;
}

// Loss (損失) の計算
function calculateLoss(data, modelDegree, p, lossType) {
    let total = 0;
    const n = data.length;
    for (let point of data) {
        const pred = predict(point.x, modelDegree, p);
        const err = pred - point.y;
        if (lossType === 'mse') {
            total += Math.pow(err, 2);
        } else if (lossType === 'mae') {
            total += Math.abs(err);
        }
    }
    return total / n;
}

// 勾配計算とパラメータ更新 (1 Epoch分)
function stepGradient(data, modelDegree, p, lossType, lr) {
    let gradA = 0, gradB = 0, gradC = 0, gradD = 0;
    const n = data.length;

    for (let point of data) {
        const x = point.x;
        const y = point.y;
        const pred = predict(x, modelDegree, p);
        const err = pred - y;

        let dErr = 0;
        if (lossType === 'mse') {
            dErr = 2 * err;
        } else if (lossType === 'mae') {
            dErr = err > 0 ? 1 : (err < 0 ? -1 : 0);
        }

        // 各モデルにおける偏微分
        if (modelDegree === 1) {
            gradA += dErr * x;
            gradB += dErr * 1;
        } else if (modelDegree === 2) {
            gradA += dErr * Math.pow(x, 2);
            gradB += dErr * x;
            gradC += dErr * 1;
        } else if (modelDegree === 3) {
            gradA += dErr * Math.pow(x, 3);
            gradB += dErr * Math.pow(x, 2);
            gradC += dErr * x;
            gradD += dErr * 1;
        }
    }

    // パラメータ更新
    p.a -= lr * (gradA / n);
    p.b -= lr * (gradB / n);
    p.c -= lr * (gradC / n);
    p.d -= lr * (gradD / n);
}

// =================================================================
// 2. データ生成ロジック
// =================================================================

function generateData() {
    const dsType = document.getElementById('datasetSelect').value;
    const hasOutliers = document.getElementById('outlierCheck').checked;
    data = [];

    if (dsType === 'fixed') {
        data = [{x: 1, y: 5}, {x: 3, y: 11}, {x: 3, y: 9}, {x: 7, y: 19}];
    } else if (dsType === 'linear_noise') {
        for (let i = 0; i < 50; i++) {
            let x = (Math.random() * 10) - 5;
            let y = 2 * x + 1 + (Math.random() * 4 - 2);
            data.push({x: x, y: y});
        }
    } else if (dsType === 'quad_noise') {
        for (let i = 0; i < 50; i++) {
            let x = (Math.random() * 6) - 3;
            let y = 0.8 * x * x - 1 * x - 2 + (Math.random() * 3 - 1.5);
            data.push({x: x, y: y});
        }
    }

    if (hasOutliers && dsType !== 'fixed') {
        data.push({x: -2, y: 15});
        data.push({x: 0, y: -15});
        data.push({x: 2, y: 18});
    }
}

// =================================================================
// 3. 描画ロジック (Canvas API)
// =================================================================

const canvas = document.getElementById('graphCanvas');
const ctx = canvas.getContext('2d');

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (data.length === 0) return;

    let xMin = Math.min(...data.map(d => d.x));
    let xMax = Math.max(...data.map(d => d.x));
    let yMin = Math.min(...data.map(d => d.y));
    let yMax = Math.max(...data.map(d => d.y));

    xMin -= 1; xMax += 1;
    yMin -= 3; yMax += 3;

    const padding = 40;
    const toPxX = (x) => padding + (x - xMin) / (xMax - xMin) * (canvas.width - 2 * padding);
    const toPxY = (y) => canvas.height - padding - (y - yMin) / (yMax - yMin) * (canvas.height - 2 * padding);

    // X軸・Y軸
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(toPxX(xMin), toPxY(0)); ctx.lineTo(toPxX(xMax), toPxY(0));
    ctx.moveTo(toPxX(0), toPxY(yMin)); ctx.lineTo(toPxX(0), toPxY(yMax));
    ctx.stroke();

    // データ点 (散布図)
    for (let point of data) {
        ctx.fillStyle = '#dc3545';
        ctx.beginPath();
        ctx.arc(toPxX(point.x), toPxY(point.y), 4, 0, Math.PI * 2);
        ctx.fill();
    }

    // 予測曲線
    const modelDegree = parseInt(document.getElementById('modelSelect').value);
    ctx.strokeStyle = '#007bff';
    ctx.lineWidth = 2;
    ctx.beginPath();

    const steps = 100;
    for (let i = 0; i <= steps; i++) {
        let x = xMin + (xMax - xMin) * (i / steps);
        let y = predict(x, modelDegree, params);
        let px = toPxX(x);
        let py = toPxY(y);

        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.stroke();

    const lossType = document.getElementById('lossSelect').value;
    const currentLoss = calculateLoss(data, modelDegree, params, lossType);
    updateStatusBox(modelDegree, currentLoss);
}

function updateStatusBox(degree, loss) {
    const box = document.getElementById('statusBox');
    let paramStr = '';
    if (degree === 1) {
        paramStr = `a = ${params.a.toFixed(4)}, b = ${params.b.toFixed(4)}`;
    } else if (degree === 2) {
        paramStr = `a = ${params.a.toFixed(4)}, b = ${params.b.toFixed(4)}, c = ${params.c.toFixed(4)}`;
    } else if (degree === 3) {
        paramStr = `a = ${params.a.toFixed(4)}, b = ${params.b.toFixed(4)}, c = ${params.c.toFixed(4)}, d = ${params.d.toFixed(4)}`;
    }

    const lossDisplay = (isNaN(loss) || !isFinite(loss)) ? '発散 (学習率が高すぎます)' : loss.toFixed(4);

    box.innerHTML = `
        <strong>Epoch:</strong> ${currentEpoch}<br>
        <strong>Loss (${document.getElementById('lossSelect').value.toUpperCase()}):</strong> ${lossDisplay}<br>
        <strong>Parameters:</strong> ${paramStr}
    `;
}

// =================================================================
// 4. UI制御 & イベント処理
// =================================================================

function updateUIForModel(degree) {
    const wrapperC = document.getElementById('wrapperC');
    const wrapperD = document.getElementById('wrapperD');
    const lrInput = document.getElementById('learningRate');

    // モデルに応じた初期値フォームの表示切替と学習率設定
    if (degree === 1) {
        wrapperC.style.display = 'none';
        wrapperD.style.display = 'none';
        lrInput.value = "0.01";          // 一次式の適正学習率
    } else if (degree === 2) {
        wrapperC.style.display = 'flex';
        wrapperD.style.display = 'none';
        lrInput.value = "0.0001";        // 二次式の適正学習率
    } else if (degree === 3) {
        wrapperC.style.display = 'flex';
        wrapperD.style.display = 'flex';
        lrInput.value = "0.000001";      // 三次式の適正学習率
    }
}

function resetModel() {
    params.a = parseFloat(document.getElementById('initA').value) || 0;
    params.b = parseFloat(document.getElementById('initB').value) || 0;
    params.c = parseFloat(document.getElementById('initC').value) || 0;
    params.d = parseFloat(document.getElementById('initD').value) || 0;
    currentEpoch = 0;
    render();
}

function trainEpochs(count) {
    const modelDegree = parseInt(document.getElementById('modelSelect').value);
    const lossType = document.getElementById('lossSelect').value;
    const lr = parseFloat(document.getElementById('learningRate').value);

    for (let i = 0; i < count; i++) {
        stepGradient(data, modelDegree, params, lossType, lr);
        currentEpoch++;
    }
    render();
}

// イベントリスナー設定
document.getElementById('modelSelect').addEventListener('change', (e) => {
    updateUIForModel(parseInt(e.target.value));
    resetModel();
});

document.getElementById('datasetSelect').addEventListener('change', () => { generateData(); resetModel(); });
document.getElementById('outlierCheck').addEventListener('change', () => { generateData(); resetModel(); });
document.getElementById('lossSelect').addEventListener('change', () => { render(); });

// パラメータ初期値の入力フィールド変更時
['initA', 'initB', 'initC', 'initD'].forEach(id => {
    document.getElementById(id).addEventListener('change', resetModel);
});

// 初期起動時の状態合わせ
updateUIForModel(1);
generateData();
resetModel();

</script>
</body>
</html>
