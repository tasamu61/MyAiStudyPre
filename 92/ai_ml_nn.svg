<rect x="60" y="90" width="640" height="270" rx="14" fill="#e2e8f2" stroke="#3b4a5e" stroke-width="1.5"/><text x="76" y="116" font-weight="bold" fill="#1b2430">機械学習</text><text x="76" y="136" font-size="12" fill="#5d6b7c">線形回帰（1章）・決定木・SVM・k-means など。データから規則を作る</text>
<rect x="100" y="160" width="560" height="180" rx="14" fill="#d3dcec" stroke="#3b4a5e" stroke-width="1.5"/><text x="116" y="186" font-weight="bold" fill="#1b2430">ニューラルネットワーク</text><text x="116" y="206" font-size="12" fill="#5d6b7c">一次式（ax+b）と活性化関数を並べて重ねたモデル</text>
<rect x="140" y="230" width="480" height="90" rx="14" fill="#c1cde4" stroke="#3b4a5e" stroke-width="1.5"/><text x="156" y="256" font-weight="bold" fill="#1b2430">深層学習</text><text x="156" y="276" font-size="12" fill="#5d6b7c">隠れ層を何層も重ねたもの</text>
</svg>